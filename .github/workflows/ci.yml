name: CI
on:
  pull_request:
  push:
    branches: [main]
  # the day agent starts CI this way, because its PRs (made with GITHUB_TOKEN) start no pull_request workflows
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The same base image as the dev container, so the screenshot tests see the same pixels.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and layout tests
        run: npm test
      - name: Browser tests and fixed camera images
        run: npm run e2e
      - name: Upload the report and the changed images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
