name: Day log
description: One line about today. The day agent turns it into a new object on the island.
title: "Day log"
labels: [log]
body:
  - type: textarea
    id: log
    attributes:
      label: Today
      description: One or two sentences. This text becomes public. No names of other people, addresses, health or money details.
      placeholder: Serve practice. 40 serves, 26 in.
    validations:
      required: true
  - type: dropdown
    id: object
    attributes:
      label: Object
      description: Optional. Leave it on "Let the agent choose" to let the agent select from the table in docs/VISION.md.
      options:
        - Let the agent choose
        - house
        - tree
        - garden
      default: 0
  - type: input
    id: tags
    attributes:
      label: Tags
      description: Optional. Lowercase words with commas, for example "tennis, habit".
  - type: input
    id: date
    attributes:
      label: Date
      description: Optional, YYYY-MM-DD. Leave it empty for the date of this issue.
